          const router: any = page.getInstance(Router);
          let ctl: any = win.__C8oProductTour;
          
          if (!ctl) {
          	ctl = win.__C8oProductTour = {
          		core: tourCore,
          		defs: null,
          		path: '''',
          		loading: null,
          		conditions: {},
          		translate: null,
          		userKey: null,
          		run: null,
          		pending: null,
          		driverObj: null,
          		token: 0,
          		hint: null,
          		cleanups: [],
          		listeners: [],
          		internalDestroy: false,
          		routeChangedAt: 0,
          		cache: null,
          		cacheKey: '''',
          
          		log(message: string): void {
          			try {
          				page.c8o.log.debug(''[ProductTour] '' + message);
          			} catch (e) {
          				// no logger
          			}
          		},
          		url(): string {
          			return router.url || '''';
          		},
          		tr(value: any, params?: any): string {
          			return tourCore.text(value, ctl.translate, params);
          		},
          		label(name: string, params?: any): string {
          			return tourCore.label(ctl.defs, name, ctl.translate, params);
          		},
          		storageKey(): string {
          			let user: any = '''';
          			try {
          				user = typeof ctl.userKey == ''function'' ? ctl.userKey() : ctl.userKey;
          			} catch (e) {
          				user = '''';
          			}
          			return ''c8o.productTour:'' + (user || ''anonymous'');
          		},
          		state(): any {
          			const key = ctl.storageKey();
          			if (!ctl.cache || ctl.cacheKey != key) {
          				ctl.cache = tourCore.readState(window.localStorage, key);
          				ctl.cacheKey = key;
          			}
          			return ctl.cache;
          		},
          		save(state: any): void {
          			ctl.cache = state;
          			ctl.cacheKey = ctl.storageKey();
          			tourCore.writeState(window.localStorage, ctl.cacheKey, state);
          			ctl.notify();
          		},
          		subscribe(listener: any): any {
          			ctl.listeners.push(listener);
          			return () => {
          				ctl.listeners = ctl.listeners.filter((l: any) => l !== listener);
          			};
          		},
          		notify(): void {
          			ctl.listeners.forEach((listener: any) => {
          				try {
          					listener();
          				} catch (e) {
          					// a listener of the application failed
          				}
          			});
          		},
          		load(path: string): Promise<any> {
          			if (ctl.defs && ctl.path == path) {
          				return Promise.resolve(ctl.defs);
          			}
          			if (ctl.loading && ctl.path == path) {
          				return ctl.loading;
          			}
          			if (!tourCore.safePath(path)) {
          				ctl.log(''refused tours path: '' + path);
          				return Promise.resolve(null);
          			}
          			ctl.path = path;
          			ctl.loading = fetch(path, { credentials: ''same-origin'', cache: ''no-cache'' })
          				.then((response: any) => response.ok ? response.json() : null)
          				.then((defs: any) => {
          					ctl.defs = defs && Array.isArray(defs.tours) ? defs : null;
