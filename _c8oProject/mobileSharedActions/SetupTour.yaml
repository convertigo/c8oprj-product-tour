          					ctl.notify();
          					return ctl.defs;
          				})
          				.catch((e: any) => {
          					ctl.log(''cannot load '' + path + '': '' + e);
          					ctl.loading = null;
          					return null;
          				});
          			return ctl.loading;
          		},
          
          		// What the help menu of the application shows.
          		list(): any[] {
