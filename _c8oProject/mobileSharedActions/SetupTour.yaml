          		},
          		// A tour of this screen the user has never completed nor skipped.
          		hasNew(url?: string): boolean {
          			const tour = ctl.tourFor(url);
          			return !!tour && !tourCore.seen(ctl.state(), tour);
          		},
          		isSeen(id: string): boolean {
          			const tour = tourCore.find(ctl.defs, id);
          			return !!tour && !!tourCore.seen(ctl.state(), tour);
          		},
          		isActive(): boolean {
          			return !!ctl.run || !!ctl.pending;
          		},
          		reset(id?: string): void {
          			ctl.save(tourCore.forget(ctl.state(), id));
          		},
          
          		// Starts a tour: an id, or "@current" for the tour of the screen. "auto" starts only a tour never seen.
          		start(id: string, options?: any): boolean {
          			const opts = options || {};
          			if (!ctl.defs) {
          				return false;
          			}
