          				}
          				ctl.notify();
          				return true;
          			}
          			ctl.run = { tour: tour, index: first, entered: Date.now(), afterRoute: false, skipped: [] };
          			ctl.remember();
          			ctl.notify();
          			ctl.show();
          			return true;
          		},
          		// how: "completed", "skipped", or null to stop without remembering anything.
          		stop(how: any): void {
          			const run = ctl.run;
          			ctl.run = null;
          			ctl.pending = null;
          			ctl.token++;
          			ctl.clear();
          			ctl.hideHint();
          			ctl.destroyDriver();
          			try {
          				window.sessionStorage.removeItem(''c8o.productTour.run'');
          			} catch (e) {
          				// no session storage
          			}
          			if (run && how) {
          				ctl.save(tourCore.mark(ctl.state(), run.tour, how));
          				ctl.log(''tour '' + run.tour.id + '' '' + how);
          			} else {
          				ctl.notify();
          			}
          		},
          		// The first step of a tour; in a tour that skips the steps of other screens, the first one of this screen.
          		firstIndex(tour: any): number {
          			let index = tourCore.nextIndex(tour, -1, 1, ctl.conditions);
          			while (index >= 0 && tourCore.skipsOffRoute(tour, tour.steps[index]) && !tourCore.matches(tour.steps[index].route, ctl.url())) {
          				index = tourCore.nextIndex(tour, index, 1, ctl.conditions);
          			}
          			return index >= 0 ? index : tourCore.nextIndex(tour, -1, 1, ctl.conditions);
          		},
          		remember(): void {
          			try {
          				const step = ctl.run.tour.steps[ctl.run.index];
          				window.sessionStorage.setItem(''c8o.productTour.run'', JSON.stringify({ id: ctl.run.tour.id, step: step.id }));
          			} catch (e) {
          				// no session storage
