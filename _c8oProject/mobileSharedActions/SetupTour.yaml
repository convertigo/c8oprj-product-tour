          'page.c8o.log.debug(''[MB] '' + props.actionFunction + '': '' + props.actionName);
          const win: any = window as any;
          
          // <tour-core>
          // Pure helpers of the product tour (no DOM): tests/tour-core.test.cjs runs them under Node.
          const tourCore: any = {
          	DEFAULT_LABELS: {
          		next: ''Next'',
          		previous: ''Back'',
          		done: ''Done'',
          		skip: ''Skip tour'',
          		close: ''Close'',
          		progress: ''Step {{current}} of {{total}}'',
          		steps: ''{{total}} steps'',
          		skipStep: ''Skip this step'',
          		quit: ''Quit tour'',
          		waiting: ''The tour goes on as soon as you have done it.'',
          		paused: ''The tour is paused: it goes on when you come back to its screen.'',
          		pending: ''This tour starts on another screen.''
          	},
          	// A tours file is a JSON file of the application: a relative path, no scheme, no host, no "..".
          	safePath(path: any): boolean {
          		return typeof path == ''string''
          			&& /^(?![a-z][a-z0-9+.-]*:)(?!\/\/)[A-Za-z0-9_./-]+\.json$/i.test(path)
          			&& path.indexOf(''..'') < 0;
          	},
          	// A route pattern is a regular expression (or a list of them) tested on the router URL; none matches every URL.
          	matches(pattern: any, url: any): boolean {
          		if (pattern == null || pattern === '''') {
          			return true;
          		}
          		const list: any[] = Array.isArray(pattern) ? pattern : [pattern];
          		return list.some((p: any) => {
          			try {
          				return new RegExp(p).test(url || '''');
          			} catch (e) {
          				return false;
          			}
          		});
          	},
          	// "when" names conditions given by the application; "!name" negates one; all must hold.
          	allowed(item: any, conditions: any): boolean {
          		const names: any[] = item && item.when ? (Array.isArray(item.when) ? item.when : [item.when]) : [];
          		return names.every((name: any) => {
          			const not = String(name).charAt(0) == ''!'';
          			const key = not ? String(name).substring(1) : String(name);
          			let value: any = conditions ? conditions[key] : undefined;
          			if (typeof value == ''function'') {
          				try {
          					value = value();
          				} catch (e) {
          					value = false;
          				}
          			}
          			return not ? !value : !!value;
          		});
          	},
          	// The steps counted in "Step n of N": the allowed ones, without the branch steps (reached only by "goTo")
          	// and the steps marked "count": false (a step that is usually passed at once).
          	counted(tour: any, conditions: any): any[] {
          		return (tour.steps || []).filter((step: any) => !step.branch && step.count !== false && tourCore.allowed(step, conditions));
          	},
          	// "skipped": ids of the steps the tour has passed or will pass because their element is absent.
          	progress(tour: any, index: number, conditions: any, skipped?: any[]): any {
          		const counted = tourCore.counted(tour, conditions).filter((step: any) => !(skipped || []).includes(step.id) || step === tour.steps[index]);
          		let position = -1;
          		for (let i = index; i >= 0 && position < 0; i--) {
          			position = counted.indexOf(tour.steps[i]);
          		}
          		return { current: Math.max(position, 0) + 1, total: Math.max(counted.length, 1) };
          	},
          	// Next (direction 1) or previous (-1) step a user walks to: allowed and not a branch step; -1 when there is none.
          	nextIndex(tour: any, from: number, direction: number, conditions: any): number {
          		const steps: any[] = tour.steps || [];
          		for (let i = from + direction; i >= 0 && i < steps.length; i += direction) {
          			if (!steps[i].branch && tourCore.allowed(steps[i], conditions)) {
          				return i;
          			}
          		}
          		return -1;
          	},
          	indexOf(tour: any, id: any): number {
          		return (tour.steps || []).findIndex((step: any) => step.id == id);
          	},
          	find(defs: any, id: any): any {
          		return ((defs && defs.tours) || []).find((tour: any) => tour.id == id) || null;
          	},
          	// The tour of a screen: the first allowed tour whose "routes" match the URL.
          	tourFor(defs: any, url: any, conditions: any): any {
          		return ((defs && defs.tours) || []).find((tour: any) => tourCore.allowed(tour, conditions) && tour.routes && tourCore.matches(tour.routes, url)) || null;
          	},
          	// "@current": the tour of the screen, or the tour marked "default" when the screen has none.
          	currentTour(defs: any, url: any, conditions: any): any {
          		return tourCore.tourFor(defs, url, conditions)
          			|| ((defs && defs.tours) || []).find((tour: any) => tour.default && tourCore.allowed(tour, conditions))
          			|| null;
          	},
          	// A step of another screen pauses the tour, unless the step (or its tour) says "offRoute": "skip".
          	skipsOffRoute(tour: any, step: any): boolean {
          		return (step.offRoute || tour.offRoute) == ''skip'';
          	},
          	readState(storage: any, key: string): any {
          		try {
          			const value = JSON.parse((storage && storage.getItem(key)) || ''{}'');
          			return value && typeof value == ''object'' && !Array.isArray(value) ? value : {};
          		} catch (e) {
          			return {};
          		}
          	},
          	writeState(storage: any, key: string, state: any): void {
          		try {
          			storage.setItem(key, JSON.stringify(state));
          		} catch (e) {
          			// private mode or full storage: the tour only forgets
          		}
          	},
          	// A tour is "seen" once completed or skipped; a newer "version" of the tour makes it new again.
          	seen(state: any, tour: any): any {
          		const entry = state && state.done ? state.done[tour.id] : null;
          		return entry && (entry.v || 1) >= (tour.version || 1) ? entry : null;
          	},
          	mark(state: any, tour: any, how: string): any {
          		state.done = state.done || {};
          		state.done[tour.id] = { v: tour.version || 1, how: how, at: Date.now() };
          		return state;
          	},
          	forget(state: any, tourId: any): any {
          		if (!tourId) {
          			state.done = {};
          		} else if (state.done) {
          			delete state.done[tourId];
          		}
          		return state;
          	},
          	// A text is an i18n key or a plain text: the translation when the key exists, the value itself otherwise.
          	text(value: any, translate: any, params?: any): string {
          		if (value == null) {
          			return '''';
          		}
          		const key = String(value);
          		let out = key;
          		if (translate) {
          			try {
          				const translated = translate(key, params);
          				if (translated != null && translated !== '''' && translated !== key) {
          					out = String(translated);
          				}
          			} catch (e) {
          				// keep the key
          			}
          		}
          		return tourCore.format(out, params || {});
          	},
          	label(defs: any, name: string, translate: any, params?: any): string {
          		const key = defs && defs.labels ? defs.labels[name] : null;
          		const text = key ? tourCore.text(key, translate, params) : '''';
          		return text && text !== key ? text : tourCore.format(tourCore.DEFAULT_LABELS[name] || name, params || {});
          	},
          	format(template: any, values: any): string {
          		return String(template).replace(/\{\{\s*(\w+)\s*\}\}/g, (match: string, key: string) => values[key] != null ? String(values[key]) : match);
          	},
          	// Texts are shown as text: HTML is escaped, line breaks are kept.
          	escape(text: any): string {
          		return String(text)
          			.replace(/&/g, ''&amp;'')
          			.replace(/</g, ''&lt;'')
          			.replace(/>/g, ''&gt;'')
          			.replace(/"/g, ''&quot;'')
          			.replace(/''/g, ''&#39;'')
          			.replace(/\n/g, ''<br>'');
          	},
          	anchorSelector(anchor: any): string {
          		const names: any[] = Array.isArray(anchor) ? anchor : [anchor];
          		return names.filter((name: any) => /^[A-Za-z0-9_-]+$/.test(String(name)))
          			.map((name: any) => ''[data-tour~="'' + name + ''"]'').join('', '');
          	}
          };
