comment: |
  Sets up the product tour of the application and, optionally, starts a tour.
  
  The tours are read from a JSON file of the application (variable "tours"), see the readme of lib_ProductTour.
  The first call installs the tour engine once (window.__C8oProductTour); later calls only start tours.
